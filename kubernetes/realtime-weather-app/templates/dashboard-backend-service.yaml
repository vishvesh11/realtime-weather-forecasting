apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend-service
  labels:
    {{- include "realtime-weather-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-backend
spec:
  selector:
    {{- include "realtime-weather-app.selectorLabels" . | nindent 6 }}
    app.kubernetes.io/component: dashboard-backend
  ports:
    - protocol: TCP
      port: {{ .Values.dashboardBackendService.service.port }}
      targetPort: {{ .Values.dashboardBackendService.service.targetPort }}
      name: http
  type: {{ .Values.dashboardBackendService.service.type }}