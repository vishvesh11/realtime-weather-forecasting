apiVersion: v1
kind: Service
metadata:
  name: producer-service-service
  labels:
    {{- include "realtime-weather-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: producer-service
spec:
  selector:
    {{- include "realtime-weather-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: producer-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP