apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processor-deployment
  labels:
    {{- include "realtime-weather-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-processor
spec:
  replicas: {{ .Values.dataProcessorService.replicaCount }}
  selector:
    matchLabels:
      {{- include "realtime-weather-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-processor
  template:
    metadata:
      labels:
        {{- include "realtime-weather-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: data-processor
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
         {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: data-processor
        image: "{{ .Values.image.repository }}/data-processor:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: KAFKA_BROKER_URL
          value: {{ .Values.kafka.brokerUrl | quote }}
        - name: RAW_WEATHER_TOPIC
          value: raw-weather-data
        - name: PROCESSED_WEATHER_TOPIC
          value: processed-weather-data
        resources:
          {{- toYaml .Values.dataProcessorService.resources | nindent 12 }}