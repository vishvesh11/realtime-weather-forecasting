apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend-deployment
  labels:
    app: dashboard-backend
spec:
  replicas: {{ .Values.dashboardBackendService.replicaCount }}
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
        - name: dashboard-backend
          image: "{{ .Values.image.repository }}/dashboard-backend:{{ .Values.image.tag }}" # Updated image name for GHCR
          ports:
            - containerPort: {{ .Values.dashboardBackendService.service.targetPort }}
          env:
            - name: KAFKA_BROKER_URL
              value: {{ .Values.dashboardBackendService.env.KAFKA_BROKER_URL | quote }}
            # InfluxDB Environment Variables from Kubernetes Secret
            - name: INFLUXDB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.influxdb.existingSecretName }}
                  key: {{ .Values.secrets.influxdb.keys.url }}
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.influxdb.existingSecretName }}
                  key: {{ .Values.secrets.influxdb.keys.token }}
            - name: INFLUXDB_ORG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.influxdb.existingSecretName }}
                  key: {{ .Values.secrets.influxdb.keys.org }}
            - name: INFLUXDB_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.influxdb.existingSecretName }}
                  key: {{ .Values.secrets.influxdb.keys.bucket }}
          resources:
            {{- toYaml .Values.dashboardBackendService.resources | nindent 12 }}