apiVersion: v1
kind: Service
metadata:
  name: forecast-service-service
  labels:
    {{- include "realtime-weather-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: forecast-service
spec:
  selector:
    {{- include "realtime-weather-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: forecast-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
      name: internal-api
  type: ClusterIP
