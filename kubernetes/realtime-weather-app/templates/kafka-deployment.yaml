apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "realtime-weather-app.fullname" . }}-kafka
  labels:
    {{- include "realtime-weather-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  replicas: {{ .Values.kafka.replicaCount }}
  selector:
    matchLabels:
      {{- include "realtime-weather-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "realtime-weather-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - name: client
              containerPort: 9092
          env:
            # Zookeeper connection from values.yaml
            - name: KAFKA_CFG_ZOOKEEPER_CONNECT
              value: "{{ include "realtime-weather-app.fullname" . }}-zookeeper:2181"
            # Inject the pod's IP address as an environment variable (used by extraEnvVars)
            - name: KAFKA_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Loop through and inject all extra environment variables defined in values.yaml
            # This is where the crucial listener configurations (from values.yaml) are applied.
            {{- if .Values.kafka.extraEnvVars }}
            {{- toYaml .Values.kafka.extraEnvVars | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: kafka-data
              mountPath: /bitnami/kafka
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - bash
                - -xc
                - |
                  # Check if Kafka is listening on the client port
                  (echo > /dev/tcp/127.0.0.1/{{ .Values.kafka.service.port }}) >/dev/null 2>&1 || exit 1;
                  # Check if Kafka can serve metadata requests (implies client readiness)
                  /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:{{ .Values.kafka.service.port }} --list >/dev/null 2>&1
            initialDelaySeconds: 60 # Give Kafka plenty of time to start and sync
            periodSeconds: 10
            timeoutSeconds: 10 # Increased timeout
            failureThreshold: 12 # Increased failure threshold
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: {{ include "realtime-weather-app.fullname" . }}-kafka-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "realtime-weather-app.fullname" . }}-kafka-data
  labels:
    {{- include "realtime-weather-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Adjust storage size as needed
