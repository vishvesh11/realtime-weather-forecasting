
image:
  repository: ghcr.io/vishvesh11/realtime-weather-app
  tag: latest
  pullPolicy: Always

github:
  username: vishvesh11
  repositoryName: realtime-weather-app


imagePullSecrets:
  - name: ghcr-secret

# --- Secrets Configuration ---
secrets:
  owmApiKey:
    createSecret: true
    name: owm-api-key-secret
    key: OWM_API_KEY

  influxdb:
    createSecret: false
    existingSecretName: influxdb-secrets
    keys:
      url: INFLUXDB_URL
      token: INFLUXDB_TOKEN
      org: INFLUXDB_ORG
      bucket: INFLUXDB_BUCKET

# --- Zookeeper Subchart Configuration ---
zookeeper:
  replicaCount: 1
  image:
    repository: zookeeper
    tag: 3.8.0
  service:
    port: 2181
  storage:
    size: 1Gi
    storageClassName: local-path
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

# --- Kafka Subchart Configuration ---
kafka:
  replicaCount: 1
  image:
    repository: bitnami/kafka
    tag: 3.6.1-debian-11-r0
  service:
    port: 9092
  storage:
    size: 5Gi
    storageClassName: local-path
  resources:
    requests:
      memory: "512Mi"
      cpu: "300m"
    limits:
      memory: "1Gi"
      cpu: "700m"
  zookeeper:
    connect: "realtime-weather-app-zookeeper:2181"


  extraEnvVars:

    - name: KAFKA_CFG_LISTENERS
      value: "PLAINTEXT://:9092,PLAINTEXT_HOST://:9093"

    - name: KAFKA_CFG_ADVERTISED_LISTENERS
      value: "PLAINTEXT://realtime-weather-app-kafka:9092,PLAINTEXT_HOST://$(KAFKA_HOST):9093"


    - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
      value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"


    - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
      value: "PLAINTEXT"

    - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
      value: "1"
    - name: KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS
      value: "0"


# --- Producer Service ---
producerService:
  enabled: true
  replicaCount: 1
  env:
    KAFKA_BROKER_URL: "realtime-weather-app-kafka:9092" # Producer connects to internal port
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# --- Data Processor Service ---
dataProcessorService:
  enabled: true
  replicaCount: 1
  env:
    KAFKA_BROKER_URL: "realtime-weather-app-kafka:9092" # Data Processor connects to internal port
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

# --- Forecast Service (ML Predictor) ---
forecastService:
  enabled: true
  replicaCount: 1
  nodeSelector:
    enabled: true
    key: "kubernetes.io/hostname"
    value: "vishvesh-server-2"
  env:
    KAFKA_BROKER_URL: "realtime-weather-app-kafka:9092" # Forecast connects to internal port
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# --- Dashboard Backend Service ---
dashboardBackendService:
  enabled: true
  replicaCount: 1
  service:
    port: 5000
    targetPort: 5000
    type: ClusterIP
  env:
    KAFKA_BROKER_URL: "realtime-weather-app-kafka:9092"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"


frontendService:
  enabled: true
  replicaCount: 1
  service:
    port: 3000
    targetPort: 3000
    type: ClusterIP
  ingress:
    enabled: true
    className: traefik
    host: weather.vishvesh.me
    paths:
      - path: /
        pathType: Prefix
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod-cloudflare
    tls:
      - hosts:
          - weather.vishvesh.me
        secretName: weather-vishvesh-me-tls
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
