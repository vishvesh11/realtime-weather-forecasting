name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deployment
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # Required for multi-arch builds

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Use GITHUB_TOKEN for authentication

      - name: Get Lowercase Repository Name
        id: repo_name
        run: echo "::set-output name=name::$(echo '${{ github.repository }}' | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')"

      # Multi-arch build and push for Producer Service
      - name: Build and Push Producer Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/producer-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ steps.repo_name.outputs.name }}/producer-service:latest

      # Multi-arch build and push for Data Processor
      - name: Build and Push Data Processor
        uses: docker/build-push-action@v5
        with:
          context: ./services/data-processor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ steps.repo_name.outputs.name }}/data-processor:latest

      # Multi-arch build and push for Forecast Service
      - name: Build and Push Forecast Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/forecast
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ steps.repo_name.outputs.name }}/forecast-service:latest

      # Multi-arch build and push for Dashboard Backend
      - name: Build and Push Dashboard Backend
        uses: docker/build-push-action@v5
        with:
          context: ./services/dashboard-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ steps.repo_name.outputs.name }}/dashboard-backend:latest

      # Multi-arch build and push for Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ steps.repo_name.outputs.name }}/frontend:latest

      - name: Install Helm
        uses: azure/setup-helm@v1
        with:
          version: '3.8.1'

      - name: Set Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info
          kubectl get nodes # Add this to verify node connection

      - name: Update Helm Chart Dependencies
        run: helm dependency update kubernetes/realtime-weather-app

      - name: Upgrade/Install Helm Chart
        run: |
          helm upgrade --install realtime-weather-app kubernetes/realtime-weather-app \
            --values kubernetes/realtime-weather-app/values.yaml \
            --set github.username=${{ github.actor }} \
            --set github.repositoryName=${{ steps.repo_name.outputs.name }} \
            --set secrets.owmApiKeyBase64=$(echo -n "${{ secrets.OWM_API_KEY }}" | base64 -w 0) \
            ${INFLUXDB_SECRET_SET_ARGS} \
            --namespace default
